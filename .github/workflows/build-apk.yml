name: Build Android APK

on:
  push:
    branches:
      - claude/zomato-food-delivery-app-9lzexx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      # Release build: embeds the JS bundle (a debug APK expects a Metro dev
      # server, which won't exist on the installing phone) and is still
      # signed with the auto-generated debug keystore, so no signing setup
      # is needed. Restricted to arm64-v8a (virtually all modern Android
      # phones) instead of all 4 ABIs to keep the file small enough to hand
      # back directly.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/foodie-release.apk
          ls -la dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodie-release-apk
          path: dist/foodie-release.apk
